name: cicddemo-2026

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build project
        run: mvn --batch-mode clean package

      - name: Find generated WAR
        id: war
        shell: bash
        run: |
          WAR_FILE=$(find target -maxdepth 1 -type f -name "*.war" | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "No WAR file found in target"
            exit 1
          fi

          echo "file=$WAR_FILE" >> "$GITHUB_OUTPUT"
          echo "WAR file: $WAR_FILE"

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicddemo-war
          path: ${{ steps.war.outputs.file }}
          if-no-files-found: error

      - name: Deploy to Tomcat
        env:
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          WAR_FILE: ${{ steps.war.outputs.file }}
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/manager/text/deploy?path=/cicddemo-2026&update=true"