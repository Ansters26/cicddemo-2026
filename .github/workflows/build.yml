name: cicddemo-2026

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build Project
        run: mvn --batch-mode clean package

      - name: Show generated WAR
        run: ls -la target

      - name: Test Tomcat Manager connection
        env:
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            "$TOMCAT_URL/manager/text/list"

      - name: Deploy to Tomcat
        env:
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
        run: |
          WAR_FILE=$(find target -maxdepth 1 -type f -name "*.war" | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found"
            exit 1
          fi

          curl \
            --request PUT \
            --fail-with-body \
            --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$WAR_FILE" \
            "$TOMCAT_URL/manager/text/deploy?path=/cicddemo-2026&update=true"